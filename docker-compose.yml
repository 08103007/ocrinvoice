version: '3.8'

services:
  ocr-invoice-pro:
    container_name: ocr-invoice-pro
    build:
      context: .
      dockerfile: Dockerfile
    image: ocr-invoice-pro:latest
    restart: unless-stopped
    ports:
      - "20000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      
      # 1. AI Gemini API Key
      - GEMINI_API_KEY=
      - GEMINI_MODEL=gemini-2.5-flash
      
      # 2. Tài khoản đăng nhập
      - AUTH_USER=admin
      - AUTH_PASSWORD=invoice2026
      - NEXTAUTH_SECRET=readreceipt_secret_key_2026_antigravity
      - NEXTAUTH_URL=http://localhost:20000
      
      # 3. KẾT NỐI DATABASE POSTGRESQL CỦA BẠN:
      - DATABASE_URL=postgres://postgres:PmcPassword2026!@db:5432/pmcdb
    networks:
      - default
      - pmc_network

networks:
  default:
  pmc_network:
    name: pmc-baogia_default
    external: true
