version: '3.8'

services:
  ocr-invoice-pro:
    container_name: ocr-invoice-pro
    build:
      context: .
      dockerfile: Dockerfile
    image: ocr-invoice-pro:latest
    restart: unless-stopped
    ports:
      - "20000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      
      # 1. AI Gemini API Key (Có thể nhập ở đây hoặc nhập trên giao diện web sau)
      - GEMINI_API_KEY=
      - GEMINI_MODEL=gemini-2.5-flash
      
      # 2. Tài khoản đăng nhập
      - AUTH_USER=admin
      - AUTH_PASSWORD=invoice2026
      - NEXTAUTH_SECRET=readreceipt_secret_key_2026_antigravity
      - NEXTAUTH_URL=http://localhost:20000
      
      # 3. Kết nối Database PostgreSQL (Synology NAS / Local Server / VPS)
      # Định dạng: postgresql://[user]:[password]@[host]:[port]/[database_name]
      # Ví dụ: postgresql://postgres:mypassword@192.168.1.100:5432/invoice_db
      - DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres
